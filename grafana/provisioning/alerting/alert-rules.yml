apiVersion: 1

groups:
  - orgId: 1
    name: Suricata Critical Alerts
    folder: Suricata Monitoring
    interval: 2m
    rules:
      #=======================================================================
      # CRITICAL ATTACKS ONLY - Simple queries without regex parser
      #=======================================================================
      - uid: sql-injection-alert
        title: SQL Injection Attack Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="suricata"} |~ `(?i)(sql|sqlmap)` [5m]))'
              queryType: instant
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: 'SQL Injection attack detected'
          description: 'Suricata detected SQL injection attempts in the last 5 minutes'
        labels:
          severity: critical
          attack_type: sql_injection

      - uid: xss-attack-alert
        title: XSS Attack Detected
