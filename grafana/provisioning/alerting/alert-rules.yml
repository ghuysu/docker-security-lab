              queryType: instant
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 100
                    type: gt
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: 'High volume of security alerts'
          description: 'Suricata triggered many alerts in the last 10 minutes - possible active attack'
        labels:
          severity: critical
          attack_type: multiple

