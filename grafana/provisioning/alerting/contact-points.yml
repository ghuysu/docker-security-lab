apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-alerts
    receivers:
      - uid: email-receiver
        type: email
        settings:
          addresses: Your_Email
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: email-alerts
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 12h
